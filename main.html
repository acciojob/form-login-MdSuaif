<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="container">
        <form onsubmit="getFormValue(event)">
            <input type="text" placeholder="first name" name="fname">
            <input type="text" placeholder="last name" name="lname">
            <input type="submit" value="submit">
        </form>

        <table border="1">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Output</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                
            </tbody>
        </table>
    </div>
    

    <script>
        function getFormValue(event){
            event.preventDefault()

            const fname = document.querySelector(`[name="fname"]`).value.trim()
            const lname = document.querySelector(`[name="lname"]`).value.trim()

            // alert(fname + " " +lname)
            const tableBody = document.querySelector("#tableBody");

            const row = document.createElement("tr");

            const firstCell = document.createElement("td");
            firstCell.innerText = fname;

            const lastCell = document.createElement("td");
            lastCell.innerText = lname;

            const outputCell = document.createElement("td");
            outputCell.innerText = fname + " " + lname;

            row.append(firstCell, lastCell,outputCell);

            tableBody.append(row);

            event.target.reset();
        }
        
    </script>

</body>
</html>
